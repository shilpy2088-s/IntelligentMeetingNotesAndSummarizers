<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intelligent Meeting Notes Dashboard</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  <!-- Marked.js for Markdown Rendering -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- Custom Styling -->
  <style>
    :root {
      --bg-primary: #0b0f19;
      --bg-secondary: rgba(22, 28, 45, 0.6);
      --border-color: rgba(255, 255, 255, 0.08);
      --text-primary: #f3f4f6;
      --text-secondary: #9ca3af;
      --accent-purple: #8b5cf6;
      --accent-pink: #ec4899;
      --accent-glow: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%);
      --accent-emerald: #10b981;
      --accent-red: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(139, 92, 246, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(236, 72, 153, 0.12) 0%, transparent 40%);
    }

    .container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    header {
      text-align: center;
      margin-bottom: 1rem;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      background: var(--accent-glow);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
      letter-spacing: -0.025em;
    }

    p.subtitle {
      font-size: 1.1rem;
      color: var(--text-secondary);
    }

    /* Glassmorphism Card styling */
    .card {
      background: var(--bg-secondary);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 2.5rem;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: var(--accent-glow);
      opacity: 0.8;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 500;
      font-size: 0.875rem;
      padding: 0.35rem 0.75rem;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--text-secondary);
    }

    .status-recording .status-dot {
      background-color: var(--accent-red);
      animation: pulse 1.5s infinite;
    }

    .status-processing .status-dot {
      background-color: var(--accent-purple);
      animation: pulse 1.5s infinite;
    }

    .status-completed .status-dot {
      background-color: var(--accent-emerald);
    }

    @keyframes pulse {
      0% { transform: scale(0.9); opacity: 0.6; }
      50% { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(0.9); opacity: 0.6; }
    }

    .timer {
      font-size: 3.5rem;
      font-weight: 600;
      letter-spacing: -0.05em;
      font-family: 'Fira Code', monospace;
      color: var(--text-primary);
      margin: 0.5rem 0;
    }

    .controls {
      display: flex;
      gap: 1rem;
      width: 100%;
      justify-content: center;
    }

    button {
      font-family: 'Outfit', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      padding: 0.875rem 2rem;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--accent-glow);
      color: white;
      box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
    }

    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(139, 92, 246, 0.6);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
    }

    .btn-secondary:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.15);
      transform: translateY(-2px);
    }

    .waveform-container {
      width: 100%;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .bar {
      width: 4px;
      height: 5px;
      background: var(--accent-glow);
      border-radius: 2px;
      transition: height 0.1s ease;
    }

    /* Output Card */
    .summary-card {
      background: var(--bg-secondary);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 2.5rem;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      display: none;
      flex-direction: column;
      gap: 1.5rem;
    }

    .summary-card.visible {
      display: flex;
    }

    .summary-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 1rem;
    }

    .summary-title {
      font-size: 1.5rem;
      font-weight: 600;
    }

    .markdown-body {
      line-height: 1.7;
      color: #e5e7eb;
    }

    .markdown-body h1, .markdown-body h2, .markdown-body h3 {
      color: white;
      margin-top: 1.5rem;
      margin-bottom: 0.75rem;
      font-weight: 600;
    }

    .markdown-body h1 { font-size: 1.8rem; border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 0.3rem;}
    .markdown-body h2 { font-size: 1.4rem; }
    .markdown-body h3 { font-size: 1.2rem; }

    .markdown-body ul, .markdown-body ol {
      margin-left: 1.5rem;
      margin-bottom: 1rem;
    }

    .markdown-body li {
      margin-bottom: 0.5rem;
    }

    .markdown-body code {
      font-family: 'Fira Code', monospace;
      background: rgba(255, 255, 255, 0.1);
      padding: 0.2rem 0.4rem;
      border-radius: 4px;
      font-size: 0.9em;
    }

    .markdown-body blockquote {
      border-left: 4px solid var(--accent-purple);
      padding-left: 1rem;
      color: var(--text-secondary);
      font-style: italic;
      margin: 1rem 0;
    }

    .markdown-body hr {
      border: 0;
      height: 1px;
      background: var(--border-color);
      margin: 2rem 0;
    }

    /* Task list styling in markdown */
    .markdown-body input[type="checkbox"] {
      margin-right: 0.5rem;
      accent-color: var(--accent-purple);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Meeting Companion</h1>
      <p class="subtitle">Real-time PCM stream capture & intelligent AI summaries</p>
    </header>

    <!-- Recording Card -->
    <div class="card">
      <div id="statusBadge" class="status-badge">
        <div class="status-dot"></div>
        <span id="statusText">Ready</span>
      </div>

      <div id="timer" class="timer">00:00</div>

      <div class="waveform-container" id="waveform">
        <!-- Visual bars will be added dynamically -->
      </div>

      <div class="controls">
        <button id="btnStart" class="btn-primary">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>
          Start Session & Recording
        </button>
        <button id="btnStop" class="btn-secondary" disabled>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/></svg>
          Stop & Generate Notes
        </button>
      </div>
    </div>

    <!-- Output Card -->
    <div class="summary-card" id="summaryCard">
      <div class="summary-header">
        <div class="summary-title">Intelligent Meeting Notes</div>
        <button id="btnCopy" class="btn-secondary" style="padding: 0.5rem 1rem; font-size: 0.875rem;">Copy Markdown</button>
      </div>
      <div class="markdown-body" id="summaryContent"></div>
    </div>
  </div>

  <script>
    // Constants
    const CHUNK_DURATION_MS = 3000; // Send chunk every 3 seconds

    // State Variables
    let audioContext = null;
    let processorNode = null;
    let mediaStream = null;
    let sessionId = null;
    let chunkInterval = null;
    let secondsElapsed = 0;
    let timerInterval = null;
    let audioBufferQueue = [];

    // UI Elements
    const btnStart = document.getElementById('btnStart');
    const btnStop = document.getElementById('btnStop');
    const btnCopy = document.getElementById('btnCopy');
    const timerText = document.getElementById('timer');
    const statusBadge = document.getElementById('statusBadge');
    const statusText = document.getElementById('statusText');
    const waveform = document.getElementById('waveform');
    const summaryCard = document.getElementById('summaryCard');
    const summaryContent = document.getElementById('summaryContent');

    // Create visual equalizer bars
    const BAR_COUNT = 30;
    const barElements = [];
    for (let i = 0; i < BAR_COUNT; i++) {
      const bar = document.createElement('div');
      bar.className = 'bar';
      waveform.appendChild(bar);
      barElements.push(bar);
    }

    // Set controls
    btnStart.addEventListener('click', startRecording);
    btnStop.addEventListener('click', stopRecording);
    btnCopy.addEventListener('click', copySummary);

    function updateStatus(status, label) {
      statusBadge.className = 'status-badge status-' + status;
      statusText.textContent = label;
    }

    function formatTime(seconds) {
      const mins = String(Math.floor(seconds / 60)).padStart(2, '0');
      const secs = String(seconds % 60).padStart(2, '0');
      return `${mins}:${secs}`;
    }

    async function startRecording() {
      try {
        // 1. Request microphone access
        mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        
        // 2. Initialize Backend Session
        const startResponse = await fetch('/api/session/start', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            sampleRate: 16000,
            channels: 1,
            bitDepth: 16
          })
        });

        if (!startResponse.ok) {
          throw new Error('Failed to initialize session on server');
        }

        const startData = await startResponse.json();
        sessionId = startData.sessionId;

        // 3. Setup Web Audio API for recording at 16kHz
        audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
        const source = audioContext.createMediaStreamSource(mediaStream);
        
        // 4096 buffer size, 1 input channel, 1 output channel
        processorNode = audioContext.createScriptProcessor(4096, 1, 1);
        
        source.connect(processorNode);
        processorNode.connect(audioContext.destination);

        audioBufferQueue = [];

        // 4. Hook up audio processing handler
        processorNode.onaudioprocess = (e) => {
          const inputData = e.inputBuffer.getChannelData(0);
          
          // Compute visual amplitude
          let sum = 0;
          for (let i = 0; i < inputData.length; i++) {
            sum += inputData[i] * inputData[i];
          }
          const rms = Math.sqrt(sum / inputData.length);
          const height = Math.min(60, Math.max(5, rms * 150));
          
          // Animate waveform bars
          barElements.forEach(bar => {
            const randomHeight = height * (0.5 + Math.random() * 0.5);
            bar.style.height = `${randomHeight}px`;
          });

          // Convert Float32 to 16-bit Signed PCM
          const pcmBuffer = new Int16Array(inputData.length);
          for (let i = 0; i < inputData.length; i++) {
            let s = Math.max(-1, Math.min(1, inputData[i]));
            pcmBuffer[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
          }

          // Push raw PCM bytes into queue
          audioBufferQueue.push(pcmBuffer.buffer);
        };

        // 5. Start chunk delivery interval
        chunkInterval = setInterval(sendQueuedChunks, CHUNK_DURATION_MS);

        // 6. UI Updates
        btnStart.disabled = true;
        btnStop.disabled = false;
        secondsElapsed = 0;
        timerText.textContent = "00:00";
        timerInterval = setInterval(() => {
          secondsElapsed++;
          timerText.textContent = formatTime(secondsElapsed);
        }, 1000);

        updateStatus('recording', 'Recording...');
        summaryCard.classList.remove('visible');

      } catch (err) {
        console.error('Recording initialization failed:', err);
        alert('Could not start recording. Check mic permissions: ' + err.message);
      }
    }

    async function sendQueuedChunks() {
      if (audioBufferQueue.length === 0 || !sessionId) return;

      // Concatenate queued ArrayBuffers
      const totalLength = audioBufferQueue.reduce((acc, buf) => acc + buf.byteLength, 0);
      const combinedBuffer = new Uint8Array(totalLength);
      
      let offset = 0;
      for (const buf of audioBufferQueue) {
        combinedBuffer.set(new Uint8Array(buf), offset);
        offset += buf.byteLength;
      }
      
      // Clear queue immediately so we don't send duplicate data
      audioBufferQueue = [];

      try {
        const response = await fetch(`/api/session/${sessionId}/chunk`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/octet-stream' },
          body: combinedBuffer
        });

        if (!response.ok) {
          console.error('Failed to upload audio chunk to backend');
        }
      } catch (err) {
        console.error('Network error uploading chunk:', err);
      }
    }

    async function stopRecording() {
      // 1. Clean up audio processing
      clearInterval(timerInterval);
      clearInterval(chunkInterval);
      
      if (processorNode) {
        processorNode.disconnect();
        processorNode = null;
      }
      if (audioContext) {
        audioContext.close();
        audioContext = null;
      }
      if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
        mediaStream = null;
      }

      // Reset bars
      barElements.forEach(bar => bar.style.height = '5px');

      btnStart.disabled = false;
      btnStop.disabled = true;
      updateStatus('processing', 'Generating Notes...');

      // 2. Send remaining audio in the queue
      await sendQueuedChunks();

      // 3. Request final summarization
      try {
        const generateResponse = await fetch(`/api/session/${sessionId}/generate`, {
          method: 'POST'
        });

        if (!generateResponse.ok) {
          const errData = await generateResponse.json();
          throw new Error(errData.error || 'Failed to generate summary');
        }

        const generateData = await generateResponse.json();
        
        // 4. Render Markdown Output
        summaryContent.innerHTML = marked.parse(generateData.summary);
        summaryCard.classList.add('visible');
        updateStatus('completed', 'Finished');
        
        // Scroll to summary
        summaryCard.scrollIntoView({ behavior: 'smooth' });

      } catch (err) {
        console.error('Generation failed:', err);
        alert('Notes generation failed: ' + err.message);
        updateStatus('ready', 'Error');
      }
    }

    function copySummary() {
      const mdContent = summaryContent.innerText;
      navigator.clipboard.writeText(mdContent).then(() => {
        const prevText = btnCopy.textContent;
        btnCopy.textContent = 'Copied!';
        btnCopy.style.borderColor = 'var(--accent-emerald)';
        btnCopy.style.color = 'var(--accent-emerald)';
        setTimeout(() => {
          btnCopy.textContent = prevText;
          btnCopy.style.borderColor = 'var(--border-color)';
          btnCopy.style.color = 'var(--text-primary)';
        }, 2000);
      });
    }
  </script>
</body>
</html>
