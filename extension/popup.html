<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Meeting Companion AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  <!-- Local marked.js for CSP compliance -->
  <script src="marked.min.js"></script>
  <style>
    :root {
      --bg-primary: #0b0f19;
      --bg-secondary: rgba(22, 28, 45, 0.7);
      --border-color: rgba(255, 255, 255, 0.08);
      --text-primary: #f3f4f6;
      --text-secondary: #9ca3af;
      --accent-purple: #8b5cf6;
      --accent-pink: #ec4899;
      --accent-glow: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%);
      --accent-emerald: #10b981;
      --accent-red: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      width: 420px;
      max-height: 580px;
      overflow-y: auto;
      padding: 1.25rem;
      background-image: 
        radial-gradient(circle at 10% 10%, rgba(139, 92, 246, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 90% 90%, rgba(236, 72, 153, 0.12) 0%, transparent 50%);
    }

    .container {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 0.75rem;
    }

    .logo-section {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .logo-icon {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background: var(--accent-glow);
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      background: var(--accent-glow);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .settings-btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      padding: 0.25rem;
      border-radius: 6px;
      transition: all 0.2s;
    }

    .settings-btn:hover {
      color: white;
      background: rgba(255, 255, 255, 0.05);
    }

    /* Settings Panel */
    .settings-panel {
      display: none;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 0.75rem;
      flex-direction: column;
      gap: 0.5rem;
    }

    .settings-panel.visible {
      display: flex;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    label {
      font-size: 0.75rem;
      color: var(--text-secondary);
      font-weight: 500;
    }

    input {
      font-family: 'Outfit', sans-serif;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 0.5rem;
      color: white;
      font-size: 0.875rem;
      outline: none;
    }

    input:focus {
      border-color: var(--accent-purple);
    }

    /* Recording Card */
    .card {
      background: var(--bg-secondary);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--border-color);
      border-radius: 18px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 500;
      font-size: 0.75rem;
      padding: 0.25rem 0.6rem;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: var(--text-secondary);
    }

    .status-recording .status-dot {
      background-color: var(--accent-red);
      animation: pulse 1.5s infinite;
    }

    .status-processing .status-dot {
      background-color: var(--accent-purple);
      animation: pulse 1.5s infinite;
    }

    .status-completed .status-dot {
      background-color: var(--accent-emerald);
    }

    @keyframes pulse {
      0% { transform: scale(0.9); opacity: 0.6; }
      50% { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(0.9); opacity: 0.6; }
    }

    .timer {
      font-size: 2.25rem;
      font-weight: 600;
      font-family: 'Fira Code', monospace;
      color: var(--text-primary);
      letter-spacing: -0.03em;
    }

    button.btn {
      font-family: 'Outfit', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      padding: 0.75rem 1.5rem;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .btn-start {
      background: var(--accent-glow);
      color: white;
      box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
    }

    .btn-start:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 15px rgba(139, 92, 246, 0.5);
    }

    .btn-stop {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid var(--accent-red);
      color: #fca5a5;
    }

    .btn-stop:hover {
      background: var(--accent-red);
      color: white;
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
    }

    /* Output Card */
    .summary-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 18px;
      padding: 1.25rem;
      display: none;
      flex-direction: column;
      gap: 0.75rem;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    .summary-card.visible {
      display: flex;
    }

    .summary-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 0.5rem;
    }

    .summary-title {
      font-size: 1rem;
      font-weight: 600;
    }

    .btn-copy {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: 0.35rem 0.75rem;
      border-radius: 6px;
      font-size: 0.75rem;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s;
    }

    .btn-copy:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .markdown-body {
      line-height: 1.6;
      color: #e5e7eb;
      font-size: 0.875rem;
      max-height: 250px;
      overflow-y: auto;
      padding-right: 0.5rem;
    }

    .markdown-body h1, .markdown-body h2, .markdown-body h3 {
      color: white;
      margin-top: 1rem;
      margin-bottom: 0.5rem;
      font-weight: 600;
    }

    .markdown-body h1 { font-size: 1.25rem; border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 0.2rem; }
    .markdown-body h2 { font-size: 1.1rem; }
    .markdown-body h3 { font-size: 0.95rem; }

    .markdown-body ul, .markdown-body ol {
      margin-left: 1.25rem;
      margin-bottom: 0.75rem;
    }

    .markdown-body li {
      margin-bottom: 0.35rem;
    }

    .markdown-body code {
      font-family: 'Fira Code', monospace;
      background: rgba(255, 255, 255, 0.08);
      padding: 0.1rem 0.3rem;
      border-radius: 4px;
      font-size: 0.85em;
    }

    .markdown-body blockquote {
      border-left: 3px solid var(--accent-purple);
      padding-left: 0.75rem;
      color: var(--text-secondary);
      font-style: italic;
      margin: 0.75rem 0;
    }

    /* Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0,0,0,0.1);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.1);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255,255,255,0.2);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="logo-section">
        <div class="logo-icon"></div>
        <h1>Meeting Companion</h1>
      </div>
      <button class="settings-btn" id="btnSettings" title="API Settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.1a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </header>

    <!-- Settings Panel -->
    <div class="settings-panel" id="settingsPanel">
      <div class="input-group">
        <label for="apiUrl">Backend API URL</label>
        <input type="text" id="apiUrl" placeholder="http://127.0.0.1:3000">
      </div>
    </div>

    <!-- Active Card -->
    <div class="card">
      <div id="statusBadge" class="status-badge">
        <div class="status-dot"></div>
        <span id="statusText">Ready</span>
      </div>

      <div id="timer" class="timer">00:00</div>

      <button id="btnAction" class="btn btn-start">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>
        <span>Record Meeting Audio</span>
      </button>
    </div>

    <!-- Output Card -->
    <div class="summary-card" id="summaryCard">
      <div class="summary-header">
        <div class="summary-title">Meeting Notes</div>
        <button class="btn-copy" id="btnCopy">Copy Markdown</button>
      </div>
      <div class="markdown-body" id="summaryContent"></div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
